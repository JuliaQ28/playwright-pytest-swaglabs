[pytest]
# pythonpath = . 讓 tests/ 底下可以用 `from pages.xxx import ...`、`from schemas.xxx import ...`
# 這種絕對匯入路徑，而不需要另外安裝套件或設定 PYTHONPATH 環境變數
pythonpath = .
# 每次執行都自動產生一份自包含（不依賴外部 CSS/JS 檔案）的 HTML 測試報告
addopts = --html=reports/report.html --self-contained-html
markers =
    smoke: critical-path tests that must pass on every commit (fast subset)
    regression: full regression suite (all tests, including smoke)
